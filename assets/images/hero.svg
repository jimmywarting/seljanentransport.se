<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Tillfällig illustration. Ersätt med företagets egen bild (se README). -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
