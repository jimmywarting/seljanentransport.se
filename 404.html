<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidan hittades inte | Seljanen Transport AB</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- Stilarna ligger inline: 404-sidan kan visas på vilken sökväg som helst. -->
  <style>
    :root { --bg:#f5f3ee; --text:#16181b; --muted:#4b5058; --accent:#f2a100; --ink:#16181b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111316; --text:#ecebe6; --muted:#a8adb5; --ink:#0b0c0e; } }
    :root[data-theme="light"] { --bg:#f5f3ee; --text:#16181b; --muted:#4b5058; --ink:#16181b; }
    :root[data-theme="dark"] { --bg:#111316; --text:#ecebe6; --muted:#a8adb5; --ink:#0b0c0e; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.6; padding:1.5rem; box-sizing:border-box; }
    main { max-width:32rem; }
    .code { font-family:"Bahnschrift","DIN Alternate",system-ui,sans-serif; font-weight:700; letter-spacing:.12em; color:var(--muted); }
    h1 { font-family:"Bahnschrift","DIN Alternate",system-ui,sans-serif; font-size:clamp(2rem,6vw,3rem); line-height:1.1; margin:.5rem 0 1rem; }
    p { color:var(--muted); }
    a.btn { display:inline-block; margin-top:1rem; padding:.8rem 1.4rem; background:var(--accent); color:#16181b; font-weight:650; text-decoration:none; border-radius:6px; }
    a:focus-visible { outline:3px solid #1a5fd0; outline-offset:3px; }
    .stripe { position:fixed; left:0; right:0; top:0; height:10px; background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--ink) 14px 28px); }
  </style>
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main>
    <p class="code">FEL 404</p>
    <h1>Sidan hittades inte</h1>
    <p>Sidan du letar efter finns inte, eller så har den flyttats. Gå till startsidan för att läsa om våra tjänster eller kontakta oss.</p>
    <p>Telefon: <a href="tel:+46736997011">073-699 70 11</a></p>
    <a class="btn" id="hem" href="/">Till startsidan</a>
  </main>
  <script>
    // På GitHub Pages utan egen domän ligger sidan under /repo-namn/.
    if (location.hostname.endsWith('github.io')) {
      var first = location.pathname.split('/')[1];
      if (first) document.getElementById('hem').setAttribute('href', '/' + first + '/');
    }
  </script>
</body>
</html>
